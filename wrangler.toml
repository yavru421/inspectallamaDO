name = "inspectallamado"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "dist/wwwroot"
not_found_handling = "single-page-application"

[browser]
binding = "MY_BROWSER"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "dondlingergc-identity-db"
database_id = "1128e99a-70e1-458c-b0b7-d548a10a5533"

[[kv_namespaces]]
binding = "IDENTITY_CACHE"
id = "7f3831d3d4274a949e3fcf4e1549d671"

[[durable_objects.bindings]]
name = "INSPECTA_LLAMA_DO"
class_name = "InspectaLlamaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InspectaLlamaDO"]
