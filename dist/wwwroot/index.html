<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InspectaLlama &bull; Next-Gen AI Web Search Engine</title>
    <base href="/" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link href="InspectaLlamaDO.styles.css?v=20260730_v99" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            100: '#c9d1d9',
                            200: '#c9d1d9',
                            300: '#8b949e',
                            400: '#8b949e',
                            500: '#8b949e',
                            600: '#8b949e',
                            700: '#30363d',
                            800: '#30363d',
                            900: '#161b22',
                            950: '#0d1117',
                        },
                        indigo: {
                            300: '#2ea043',
                            400: '#238636',
                            500: '#2ea043',
                            600: '#238636',
                        },
                        cyan: {
                            300: '#2ea043',
                            400: '#238636',
                            500: '#2ea043',
                            600: '#238636',
                        }
                    }
                }
            }
        }
    </script>
    <link href="css/app.css?v=20260730_v99" rel="stylesheet" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app">
        <div class="shotstack-loader">
            <div class="spinner"></div>
            <span class="loading-text">Mounting InspectaLlama Edge Core...</span>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: var(--blazor-load-percentage, 0%)"></div>
            </div>
            <style>
                .progress-text::after {
                    content: var(--blazor-load-percentage-text, "0") "%";
                }
            </style>
            <span class="progress-text">Loading... </span>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 left-0 right-0 bg-red-900/90 text-white p-4 text-center text-sm z-50">
        An unhandled error has occurred.
        <a href="" class="underline font-bold ml-2">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/pwa-helper.js"></script>
    <script src="js/zla-interop.js"></script>
</body>
</html>
