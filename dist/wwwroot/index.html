<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InspectaLlama &bull; Next-Gen AI Web Search Engine</title>
    <base href="/" />

    <meta name="description" content="Autonomous web graph traversal, dialectical claim verification, and source audits powered by Cloudflare Workers AI." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />

    <!-- Custom CSS design system ONLY — no Tailwind -->
    <link href="css/app.css?v=20260731_v1" rel="stylesheet" />
    <link href="InspectaLlamaDO.styles.css?v=20260731_v1" rel="stylesheet" />

    <style>
        /* Boot loader styles */
        html, body { margin: 0; padding: 0; background: #070a12; color: #f8fafc; font-family: 'Inter', sans-serif; }

        .boot-loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1.5rem;
            background: radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.08), transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(99, 102, 241, 0.08), transparent 50%),
                        #070a12;
        }

        .boot-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #06b6d4, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .boot-progress-wrap {
            width: 280px;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 999px;
            overflow: hidden;
        }

        .boot-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #6366f1);
            border-radius: 999px;
            width: var(--blazor-load-percentage, 0%);
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
        }

        .boot-label {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .boot-label::after {
            content: var(--blazor-load-percentage-text, "0") "%";
            color: #06b6d4;
            margin-left: 0.3rem;
        }

        /* Blazor error bar */
        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(127, 29, 29, 0.95);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            z-index: 9999;
        }

        #blazor-error-ui a {
            color: #f87171;
            font-weight: 700;
            text-decoration: underline;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot-loader">
            <div class="boot-brand">InspectaLlama</div>
            <div class="boot-progress-wrap">
                <div class="boot-progress-fill"></div>
            </div>
            <span class="boot-label">Mounting Edge Core...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/pwa-helper.js"></script>
    <script src="js/zla-interop.js"></script>
</body>
</html>
